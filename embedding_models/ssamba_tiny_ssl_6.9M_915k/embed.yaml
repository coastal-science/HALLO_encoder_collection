# SSAMBA-tiny | self-supervised | 6.9M backbone params | 915k training spectrograms
# Self-supervised on the labelled DORI clips, OC02 capped at 500k (pretraining comparison arm J;
# MLflow 54bd84245a234c18b8d640854dd4b4cf). 192-d embeddings. SSAMBA expects exactly
# 256 mel x 563 frame inputs (3 s @ 24 kHz), the preprocessor from ../00_base.yaml; don't change it.
#
# Frozen-encoder embeddings + linear probe on the DCLDE 2027 test dataset (../test_dataset/). All paths are
# relative to the repo root, so run from there. To embed your own data, see "Embedding your own data" in ../README.md.
preprocessor:
  dataset:
    annotations_csv: embedding_models/test_dataset/dclde_2027_test_annotations.csv
model_trainer:
  run_name: embed_ssamba_tiny_ssl_6.9M_915k_dclde_test
  dataloader:
    splits_path: embedding_models/test_dataset/dclde_2027_test_splits.csv
    classes: [Background, HW, SRKW, TKW]
embeddings:
  checkpoint_path: embedding_models/ssamba_tiny_ssl_6.9M_915k/ssamba_tiny_ssl_6.9M_915k.pt
